<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOP-Guard 產線設定</title>
<link rel="stylesheet" href="/eip.css">
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand"><span class="logo">S</span><span class="txt">SOP-Guard</span></div>
    <nav>
      <div class="grp">現場</div>
      <a href="/"><span class="ico">▶</span><span class="txt">監控畫面</span></a>
      <div class="grp">設定</div>
      <a href="/lines" class="on"><span class="ico">≡</span><span class="txt">產線設定</span></a>
      <a href="/methods"><span class="ico">▦</span><span class="txt">包裝方式設定</span></a>
      <a href="/label"><span class="ico">▣</span><span class="txt">標記物品</span></a>
    </nav>
  </aside>
  <div class="main">
    <header class="topbar"><h1>產線設定</h1></header>
    <div class="crumb"><b>SOP-Guard</b><span>/</span><span>產線設定</span></div>
    <section class="view">
      <div class="query">
        <div class="fld w100"><label for="qFactory">廠別</label><select id="qFactory"></select></div>
        <div class="fld w180"><label for="qKey">關鍵字（產線／型體）</label><input id="qKey"></div>
        <button class="btn btn-primary raised icon" id="btnSearch" aria-label="查詢">查詢</button>
        <span class="spacer"></span>
        <div class="menuwrap">
          <button class="btn btn-secondary raised" data-menu="opMenu" aria-haspopup="true">操作 ▾</button>
          <div class="menu" id="opMenu" hidden><button id="mAdd">新增產線</button></div>
        </div>
      </div>
      <div class="legend">
        <span><i style="background:var(--st-danger)"></i>停用</span>
        <span><i style="background:var(--st-warn)"></i>不能啟動監控（還沒指定包裝方式、模型沒訓練或沒有相機）</span>
        <span>雙擊一列＝唯讀查看；編輯只走 ✎</span>
      </div>
      <div class="gridwrap" style="margin-top:8px"><table class="grid" id="grid"></table></div>
    </section>
  </div>
</div>

<!-- 產線編輯（openSmall） -->
<div class="scrim" id="dlg" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dTitle">
    <div class="dt"><span class="mark">▍</span><h4 id="dTitle">產線</h4></div>
    <div class="dc">
      <div class="frow">
        <div class="fld w140"><label for="fName">產線名稱</label><input id="fName"></div>
        <div class="fld w140"><label for="fFactory">廠別</label><input id="fFactory"></div>
        <label style="display:inline-flex;gap:6px;align-items:center;padding-top:14px"><input type="checkbox" id="fEnabled"> 啟用</label>
      </div>
      <div class="frow">
        <div class="fld" style="width:100%"><label for="fCamera">相機來源（編號 0、1… 或 rtsp 網址；密碼只存在這台電腦、畫面上遮成 ***）</label><input id="fCamera" placeholder="rtsp://帳號:密碼@192.168.1.10:554/stream1"></div>
      </div>
      <div class="frow">
        <div class="fld w100"><label for="fX">桌面範圍 x</label><input id="fX" type="number" min="0"></div>
        <div class="fld w100"><label for="fY">y</label><input id="fY" type="number" min="0"></div>
        <div class="fld w100"><label for="fW">寬</label><input id="fW" type="number" min="1"></div>
        <div class="fld w100"><label for="fH">高</label><input id="fH" type="number" min="1"></div>
      </div>
      <div class="note info">桌面範圍跟著相機位置走，所以放在產線。四格都留空＝用包裝方式自己標記時的範圍（只有相機來源會套用產線的範圍；示範影片一律用包裝方式自己的）。</div>
      <div class="note danger" id="fErr" hidden></div>
    </div>
    <div class="da"><button class="btn btn-cancel" id="dCancel">取消</button><button class="btn btn-primary raised" id="dSave">儲存</button></div>
  </div>
</div>

<!-- 刪除確認（380） -->
<div class="scrim" id="del" hidden>
  <div class="dialog xs" role="dialog" aria-modal="true" aria-labelledby="delTitle">
    <div class="dt"><span class="mark">▍</span><h4 id="delTitle">刪除產線</h4></div>
    <div class="dc"><div id="delMsg"></div></div>
    <div class="da"><button class="btn btn-cancel" id="delCancel">取消</button><button class="btn btn-danger raised" id="delOk">刪除</button></div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  let rows = [], editing = null, readOnly = false, delId = null;
  function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  async function api(path, body) { const r = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {}); return r.json(); }
  function toast(t, bad) { const x = $("toast"); x.textContent = t; x.className = "toast" + (bad ? " bad" : ""); x.hidden = false; clearTimeout(toast._h); toast._h = setTimeout(() => { x.hidden = true; }, 4000); }
  document.addEventListener("click", (ev) => {
    const t = ev.target.closest("[data-menu]");
    document.querySelectorAll(".menu").forEach((m) => { if (!t || m.id !== t.dataset.menu) m.hidden = true; });
    if (t) { const m = $(t.dataset.menu); m.hidden = !m.hidden; }
  });
  const COLS = [["產線", 100, "pinL"], ["廠別", 100], ["相機", 250], ["桌面範圍 (x, y, w, h)", 155], ["型體", 100], ["地區", 100], ["型體名稱", 155],
    ["客戶", 100], ["包裝方式", 120], ["配色", 100], ["換線時間", 140], ["監控狀態", 100, "c"], ["操作", 96, "pinR c"]];
  const filters = {};

  async function load() {
    const d = await api("/api/lines"); rows = d.lines || [];
    const fs = $("qFactory"), cur = fs.value; fs.innerHTML = ""; fs.appendChild(el("option", null, "全部"));
    for (const f of [...new Set(rows.map((r) => r.factory).filter(Boolean))]) fs.appendChild(el("option", null, f));
    if ([...fs.options].some((o) => o.value === cur)) fs.value = cur;
    render(d.running_line);
  }
  function vals(r) {
    const pk = r.packaging || {};
    return [r.name, r.factory, r.has_camera ? r.camera : "（未設定）", r.table_region ? r.table_region.join(", ") : "（用包裝方式的）",
      pk.style || "", pk.region || "", pk.style_name || "", pk.customer || "", r.project || "",
      r.color === "__new" ? "新配色" : r.color || "", r.switched_at || ""];
  }
  function render(runningLine) {
    const t = $("grid"); t.innerHTML = "";
    const th = el("thead"), h1 = el("tr"), h2 = el("tr", "ff");
    COLS.forEach((c, i) => {
      const x = el("th", c[2] || "", c[0]); x.style.minWidth = c[1] + "px"; if (i === 6) x.style.width = "100%"; h1.appendChild(x);
      const f = el("th", c[2] || "");
      if (i < 11) { const inp = el("input"); inp.value = filters[i] || ""; inp.setAttribute("aria-label", c[0] + " 篩選"); inp.oninput = () => { filters[i] = inp.value; render(runningLine); setTimeout(() => { const n = $("grid").querySelectorAll("tr.ff input")[i]; n.focus(); n.setSelectionRange(n.value.length, n.value.length); }, 0); }; f.appendChild(inp); }
      h2.appendChild(f);
    });
    th.appendChild(h1); th.appendChild(h2); t.appendChild(th);
    const tb = el("tbody"), fac = $("qFactory").value, key = $("qKey").value.trim();
    let shown = 0;
    for (const r of rows) {
      const v = vals(r);
      if (fac && fac !== "全部" && r.factory !== fac) continue;
      if (key && !(r.name.includes(key) || (r.packaging && (r.packaging.style || "").includes(key)))) continue;
      if (Object.entries(filters).some(([i, q]) => q && !String(v[i]).includes(q))) continue;
      shown++;
      const tr = el("tr", !r.enabled ? "t-danger" : !r.can_run || !r.has_camera ? "t-warn" : "");
      v.forEach((x, j) => tr.appendChild(el("td", j === 0 ? "pinL" : j === 10 ? "n" : "", x)));
      const st = el("td", "c"), running = runningLine === r.id;
      st.appendChild(el("span", "chip " + (!r.enabled ? "off" : running ? "ok" : r.can_run ? "ok" : "warn"),
        !r.enabled ? "停用" : running ? "監控中" : r.can_run ? (r.trial ? "可啟動（試跑）" : "可啟動") : "不能啟動"));
      if (r.problem) st.title = r.problem;
      tr.appendChild(st);
      const op = el("td", "pinR c"), box = el("span", "ops");
      const b1 = el("button", "ib c-edit", "✎"); b1.title = "編輯"; b1.setAttribute("aria-label", "編輯"); b1.onclick = () => openEdit(r, false); box.appendChild(b1);
      if (r.enabled) { const b2 = el("button", "ib c-sec", "⇄"); b2.title = "換包裝方式"; b2.setAttribute("aria-label", "換包裝方式"); b2.onclick = () => { location.href = "/?line=" + encodeURIComponent(r.id) + "&switch=1"; }; box.appendChild(b2); }
      if (!running) { const b3 = el("button", "ib c-del", "✕"); b3.title = "刪除"; b3.setAttribute("aria-label", "刪除"); b3.onclick = () => openDel(r); box.appendChild(b3); }
      op.appendChild(box); tr.appendChild(op);
      tr.ondblclick = () => openEdit(r, true);
      tb.appendChild(tr);
    }
    if (!shown) { const tr = el("tr", "empty"), td = el("td", null, rows.length ? "沒有符合條件的產線" : "還沒有產線，按「操作 ▾ → 新增產線」"); td.colSpan = COLS.length; tr.appendChild(td); tb.appendChild(tr); }
    t.appendChild(tb);
  }
  function openEdit(r, ro) {
    editing = r; readOnly = ro;
    $("dTitle").textContent = r ? (ro ? "查看產線　" : "編輯產線　") + r.name : "新增產線";
    $("fName").value = r ? r.name : ""; $("fFactory").value = r ? r.factory : ""; $("fEnabled").checked = r ? r.enabled : true;
    $("fCamera").value = r ? r.camera : "";
    const reg = r && r.table_region; ["fX", "fY", "fW", "fH"].forEach((id, k) => { $(id).value = reg ? reg[k] : ""; });
    ["fName", "fFactory", "fEnabled", "fCamera", "fX", "fY", "fW", "fH"].forEach((id) => { $(id).disabled = ro; });
    $("dSave").hidden = ro; $("dCancel").textContent = ro ? "關閉" : "取消"; $("fErr").hidden = true;
    $("dlg").hidden = false; if (!ro) $("fName").focus();
  }
  $("dCancel").onclick = () => { $("dlg").hidden = true; };
  $("dSave").onclick = async () => {
    const reg = ["fX", "fY", "fW", "fH"].map((id) => $(id).value.trim());
    let table_region = null;
    if (reg.some((v) => v !== "")) {
      if (reg.some((v) => v === "")) { $("fErr").textContent = "桌面範圍四格要全填，或全部留空"; $("fErr").hidden = false; return; }
      table_region = reg.map(Number);
    }
    const line = { id: editing ? editing.id : "", name: $("fName").value.trim(), factory: $("fFactory").value.trim(), camera: $("fCamera").value.trim(),
      enabled: $("fEnabled").checked, table_region };
    const d = await api("/api/lines/save", { line });
    if (!d.ok) { $("fErr").textContent = d.error; $("fErr").hidden = false; return; }
    $("dlg").hidden = true; toast("已儲存"); load();
  };
  function openDel(r) { delId = r.id; $("delMsg").textContent = `確定刪除「${r.name}」？產線的相機與桌面範圍設定會一起刪掉，包裝方式不受影響。`; $("del").hidden = false; }
  $("delCancel").onclick = () => { $("del").hidden = true; };
  $("delOk").onclick = async () => { const d = await api("/api/lines/delete", { id: delId }); $("del").hidden = true; if (!d.ok) { toast(d.error, true); return; } toast("已刪除"); load(); };
  $("mAdd").onclick = () => openEdit(null, false);
  $("btnSearch").onclick = () => load();
  $("qKey").onkeydown = (ev) => { if (ev.key === "Enter") load(); };
  document.addEventListener("keydown", (ev) => { if (ev.key === "Escape") { $("dlg").hidden = true; $("del").hidden = true; } });
  load();
})();
</script>
</body>
</html>
